app = "palmrest"
file = "palmrest/gestures.toml"
version = 1

[[key]]
path = "rejection"
default = "on"
label = "Palm rejection"
help = "Ignore a resting palm and the light touches around a scroll."
section = "Palm rejection"
exposure = "basic"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["on", "off"]

[key.page]
kind = "mouse_and_gestures"

[[key]]
path = "foreign_output"
default = "touchpad"
label = "Scrolling in other apps"
help = "How apps that do not know the mouse receive its scrolling: a virtual touchpad, a wheel, or nothing."
section = "Other apps"
exposure = "basic"

[key.kind]
kind = "segmented"

[key.kind.v]
variants = ["touchpad", "wheel", "off"]

[key.page]
kind = "mouse_and_gestures"

[[key]]
path = "foreign_momentum"
default = "toolkit"
label = "Momentum in other apps"
help = "Who runs the glide after a flick: the app's own kinetic scroll, or palmrest."
section = "Other apps"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["toolkit", "ours"]

[key.page]
kind = "mouse_and_gestures"

[[key]]
path = "gestures.gesture_action_map.one_finger_swipe_right"
default = "back"
label = "One-finger swipe right"
help = "What sliding one finger to the right does."
section = "Gestures"
exposure = "basic"

[key.kind]
kind = "menu"

[key.kind.v]
variants = ["none", "back", "forward", "workspace_prev", "workspace_next", "workspace_overview", "smart_zoom"]

[key.page]
kind = "mouse_and_gestures"

[[key]]
path = "gestures.gesture_action_map.one_finger_swipe_left"
default = "forward"
label = "One-finger swipe left"
help = "What sliding one finger to the left does."
section = "Gestures"
exposure = "basic"

[key.kind]
kind = "menu"

[key.kind.v]
variants = ["none", "back", "forward", "workspace_prev", "workspace_next", "workspace_overview", "smart_zoom"]

[key.page]
kind = "mouse_and_gestures"

[[key]]
path = "gestures.gesture_action_map.two_finger_swipe_right"
default = "workspace_prev"
label = "Two-finger swipe right"
help = "What sliding two fingers to the right does."
section = "Gestures"
exposure = "basic"

[key.kind]
kind = "menu"

[key.kind.v]
variants = ["none", "back", "forward", "workspace_prev", "workspace_next", "workspace_overview", "smart_zoom"]

[key.page]
kind = "mouse_and_gestures"

[[key]]
path = "gestures.gesture_action_map.two_finger_swipe_left"
