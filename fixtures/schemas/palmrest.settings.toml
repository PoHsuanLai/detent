app = "palmrest"
file = "palmrest/gestures.toml"
version = 1

[[key]]
path = "gestures.gesture_action_map.one_finger_swipe_right"
default = "back"
label = "One-finger swipe right"
help = "What this gesture does."
section = "Gestures"
exposure = "basic"

[key.kind]
kind = "menu"

[key.kind.v]
variants = ["none", "back", "forward", "workspace_prev", "workspace_next", "workspace_overview", "smart_zoom"]

[key.page]
kind = "mouse_and_gestures"

[key.labels]
back = "Back"
forward = "Forward"
none = "Nothing"
smart_zoom = "Smart zoom"
workspace_next = "Next workspace"
workspace_overview = "Workspace overview"
workspace_prev = "Previous workspace"

