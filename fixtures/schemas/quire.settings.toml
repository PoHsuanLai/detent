app = "quire"
file = "quire/appearance.toml"
version = 1

[[key]]
path = "appearance.theme"
default = "system"
label = "Theme"
help = "Follows the desktop, or stays in light or dark mode."
section = "Colour"
exposure = "basic"
agent = "settable"

[key.kind]
kind = "segmented"

[key.kind.v]
variants = ["system", "light", "dark"]

[key.page]
kind = "appearance"

[[key]]
path = "appearance.accent"
default = "blue"
label = "Accent"
help = "Colours buttons, selection, switches and focus rings."
section = "Colour"
exposure = "basic"
agent = "settable"

[key.kind]
kind = "menu"

[key.kind.v]
variants = ["blue", "purple", "pink", "red", "orange", "yellow", "green", "graphite"]

[key.page]
kind = "appearance"

[[key]]
path = "appearance.motion_level"
default = "standard"
label = "Reduce motion"
help = "Swaps slides and springs for fades."
section = "Accessibility"
exposure = "basic"
note = "The desktop's own reduce-motion setting always applies."

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["standard", "reduced"]

[key.page]
kind = "appearance"

[[key]]
path = "appearance.transparency"
default = "system"
label = "Reduce transparency"
help = "Makes blurred and see-through areas solid."
section = "Accessibility"
exposure = "basic"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["system", "reduced"]

[key.page]
kind = "appearance"

[[key]]
path = "appearance.look"
default = "standard"
label = "Look"
help = "Restyles every window."
section = "Style"
exposure = "basic"
agent = "settable"
note = "Standard puts the desktop back as it shipped."

[key.kind]
kind = "provided"

[key.kind.v]
capability = "look"

[key.page]
kind = "appearance"

[[key]]
path = "appearance.file_icons"
default = "standard"
label = "File icons"
help = "Shows icons you added for each file type."
section = "Icons"
exposure = "basic"
agent = "settable"
note = "A file type without an icon keeps the standard one."

[key.kind]
kind = "provided"

[key.kind.v]
capability = "file_icons"

[key.page]
kind = "appearance"

[[key]]
path = "appearance.custom_styles"
default = "use"
label = "Use my styles"
help = "Draws the look you chose and your own style sheets."
section = "Style"
exposure = "basic"
agent = "settable"
note = "Turn this off if a style makes something hard to use."

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["use", "off"]

[key.page]
kind = "appearance"

[[key]]
path = "icons.style"
default = "colour"
label = "App icon style"
help = "How colourful app icons are."
section = "Icons"
exposure = "basic"
note = "Colour keeps each icon as designed; Muted holds the colour down; Monochrome uses one hue."

[key.kind]
kind = "segmented"

[key.kind.v]
variants = ["colour", "muted", "monochrome"]

[key.page]
kind = "appearance"

[[key]]
path = "region.hours"
default = "auto"
label = "Time format"
help = "Writes times in 12 or 24 hours everywhere."
section = "Text and time"
exposure = "basic"
note = "Automatic follows your language and region."

[key.kind]
kind = "segmented"

[key.kind.v]
variants = ["auto", "12", "24"]

[key.page]
kind = "appearance"
