app = "sill"
file = "sill/settings.toml"
version = 1

[[key]]
path = "bar.autohide"
default = "full_screen_only"
label = "Automatically hide and show the menu bar"
help = "Shows the menu bar when the pointer reaches the top."
section = "Menu bar"
exposure = "basic"
note = "In full screen the bar returns when the pointer rests at the top."

[key.kind]
kind = "segmented"

[key.kind.v]
variants = ["always", "desktop_only", "full_screen_only", "never"]

[key.page]
kind = "appearance"

[[key]]
path = "bar.battery_low_percent"
default = 20
label = "Low battery"
help = "The battery icon turns red at this charge or lower."
section = "Menu bar"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 5
max = 50
unit = "%"

[key.page]
kind = "appearance"

[[key]]
path = "dock.tile_size_px"
default = 48
label = "Size"
help = "How big icons are at rest."
section = "Dock"
exposure = "basic"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 32
max = 80
unit = "px"

[key.page]
kind = "dock"

[key.ends]
low = "Small"
high = "Large"

[[key]]
path = "dock.magnification"
default = "on"
label = "Magnification"
help = "Icons grow under the pointer."
section = "Dock"
exposure = "basic"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["on", "off"]

[key.page]
kind = "dock"

[[key]]
path = "dock.magnified_size_px"
default = 72
label = "Magnified size"
help = "How big the icon under the pointer gets."
section = "Dock"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 32
max = 72
unit = "px"

[key.page]
kind = "dock"

[key.ends]
low = "Small"
high = "Large"

[[key]]
path = "dock.autohide"
default = "off"
label = "Automatically hide the Dock"
help = "Shows the Dock when the pointer reaches the bottom."
section = "Hiding"
exposure = "basic"
note = "The Dock slides away until the pointer reaches the bottom edge."

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["on", "off"]

[key.page]
kind = "dock"

[[key]]
path = "dock.indicators"
default = "on"
label = "Show indicators for open apps"
help = "A dot under each app with a window."
section = "Behaviour"
exposure = "basic"
note = "A small dot shows under apps that are open."

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["on", "off"]

[key.page]
kind = "dock"

[[key]]
path = "dock.trash"
default = "on"
label = "Show Trash"
help = "Adds a Trash tile at the end."
section = "Behaviour"
exposure = "basic"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["on", "off"]

[key.page]
kind = "dock"

[[key]]
path = "dock.floor"
default = "off"
label = "Floor"
help = "A soft light band under the icons."
section = "Dock"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["on", "off"]

[key.page]
kind = "dock"

[[key]]
path = "launcher.clipboard_history"
default = "memory"
label = "Clipboard history"
help = "Keeps copies in memory only; password copies are never kept."
section = "Clipboard"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["off", "memory"]

[key.page]
kind = "appearance"

[[key]]
path = "launcher.emoji_skin_tone"
default = "default"
label = "Emoji skin tone"
help = "Used for emoji that have one."
section = "Search"
exposure = "advanced"

[key.kind]
kind = "menu"

[key.kind.v]
variants = ["default", "light", "medium_light", "medium", "medium_dark", "dark"]

[key.page]
kind = "appearance"

[[key]]
path = "launcher.web_search"
default = "on"
label = "Search the web"
help = "Offers a web search as the last result."
section = "Search"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["on", "off"]

[key.page]
kind = "appearance"

[[key]]
path = "launcher.currency"
default = "off"
label = "Currency conversion"
help = "Converts currencies with daily rates; off fetches nothing."
section = "Search"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["off", "ecb"]

[key.page]
kind = "appearance"

[[key]]
path = "scroll.natural"
default = "natural"
label = "Natural scrolling"
help = "Content moves with your fingers."
section = "Scrolling"
exposure = "basic"
note = "Content moves the way your fingers move."

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["natural", "traditional"]

[key.page]
kind = "mouse_and_gestures"

[[key]]
path = "scroll.momentum"
default = "on"
label = "Momentum"
help = "A flick keeps scrolling after you lift."
section = "Momentum"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["on", "off"]

[key.page]
kind = "mouse_and_gestures"

[[key]]
path = "scroll.scrollbars"
default = "when_scrolling"
label = "Show scroll bars"
help = "Only while scrolling, or always."
section = "Scroll bars"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["when_scrolling", "always"]

[key.page]
kind = "mouse_and_gestures"

[[key]]
path = "scrollbar.track_click_mode"
default = "page_toward_click"
label = "Clicking the track"
help = "Pages toward the click, or jumps to it."
section = "Scroll bars"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["page_toward_click", "jump_to_click"]

[key.page]
kind = "mouse_and_gestures"

[[key]]
path = "notifications.dnd"
default = "off"
label = "Do Not Disturb"
help = "No banners or sounds, except critical ones."
section = "Alerts"
exposure = "basic"
note = "Critical notifications still come through."

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["on", "off"]

[key.page]
kind = "notifications"

[[key]]
path = "notifications.banner_style"
default = "banner"
label = "Notification style"
help = "Banners leave on their own; alerts stay until you act."
section = "Alerts"
exposure = "basic"
note = "Alerts stay until you answer them."

[key.kind]
kind = "segmented"

[key.kind.v]
variants = ["banner", "alert", "none"]

[key.page]
kind = "notifications"

[[key]]
path = "notifications.swipe"
default = "keep_in_center"
label = "Swiping a banner away"
help = "Keeps it in the notification center, or dismisses it."
section = "Swiping"
exposure = "advanced"
note = "Kept notifications wait in the notification center."

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["keep_in_center", "dismiss"]

[key.page]
kind = "notifications"

[[key]]
path = "control_center.modules"
default = ["wifi", "bluetooth", "focus", "display", "keyboard_brightness", "sound", "now_playing", "appearance", "battery", "terminal"]
label = "Modules"
help = "Which tiles show, and in what order."
section = "Control Center"
exposure = "advanced"

[key.kind]
kind = "list"

[key.kind.v]
kind = "menu"

[key.kind.v.v]
variants = ["wifi", "bluetooth", "focus", "display", "keyboard_brightness", "sound", "now_playing", "appearance", "battery", "terminal"]

[key.page]
kind = "appearance"

[[key]]
path = "control_center.menu_bar_wifi"
default = "show"
label = "Wi-Fi in the menu bar"
help = "Shows Wi-Fi as its own menu bar item."
section = "Menu bar"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["show", "hide"]

[key.page]
kind = "appearance"

[[key]]
path = "control_center.menu_bar_bluetooth"
default = "hide"
label = "Bluetooth in the menu bar"
help = "Shows Bluetooth as its own menu bar item."
section = "Menu bar"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["show", "hide"]

[key.page]
kind = "appearance"

[[key]]
path = "control_center.menu_bar_sound"
default = "show"
label = "Sound in the menu bar"
help = "Shows Sound as its own menu bar item."
section = "Menu bar"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["show", "hide"]

[key.page]
kind = "appearance"

[[key]]
path = "control_center.menu_bar_display"
default = "hide"
label = "Display in the menu bar"
help = "Shows Display as its own menu bar item."
section = "Menu bar"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["show", "hide"]

[key.page]
kind = "appearance"

[[key]]
path = "control_center.menu_bar_battery"
default = "show"
label = "Battery in the menu bar"
help = "Shows Battery as its own menu bar item."
section = "Menu bar"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["show", "hide"]

[key.page]
kind = "appearance"

[[key]]
path = "control_center.menu_bar_now_playing"
default = "hide"
label = "Now Playing in the menu bar"
help = "Shows Now Playing as its own menu bar item."
section = "Menu bar"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["show", "hide"]

[key.page]
kind = "appearance"

[[key]]
path = "display.brightness_keys_target"
default = "pointer_output"
label = "Brightness keys adjust"
help = "The display under the pointer, or every display."
section = "Display"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["pointer_output", "all_outputs"]

[key.page]
kind = "appearance"

[[key]]
path = "display.hardware_volume"
default = "when_monitor_is_output"
label = "Monitor speakers follow the volume"
help = "Volume changes also set the monitor's own volume when it supports that."
section = "Display"
exposure = "advanced"
note = "Only monitors that accept volume changes."

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["off", "when_monitor_is_output"]

[key.page]
kind = "appearance"

[[key]]
path = "display.night_warmth"
default = "off"
label = "Night warmth"
help = "Warms external monitors by lowering their blue and green; undone when off."
section = "Display"
exposure = "advanced"
note = "Only external monitors that support it change."

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["off", "hardware"]

[key.page]
kind = "appearance"

[[key]]
path = "display.night_warmth_strength"
default = 50
label = "Night warmth strength"
help = "0 leaves white alone; 100 warms it the most."
section = "Display"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 0
max = 100
unit = "%"

[key.page]
kind = "appearance"

[key.ends]
low = "Cool"
high = "Warm"

[[key]]
path = "display.font_rendering"
default = "auto"
label = "Text rendering in other apps"
help = "Auto sets smooth text for other apps, unless you've set your own."
section = "Display"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["auto", "off"]

[key.page]
kind = "appearance"

[[key]]
path = "session.lock_grace_s"
default = 5
label = "Require the password after the display turns off"
help = "Seconds a quick wake skips the password; locking, lid close and sleep always ask."
section = "Lock screen"
exposure = "advanced"
note = "Set 0 to always ask for the password."

[key.kind]
kind = "bounded"

[key.kind.v]
min = 0
max = 60
unit = "s"

[key.page]
kind = "power"

[[key]]
path = "calendar.sources"
default = "auto"
label = "Calendars"
help = "Auto finds your calendars; off uses none; or list .ics files and folders, separated by ;."
section = "Calendar"
exposure = "advanced"

[key.kind]
kind = "text"

[key.page]
kind = "notifications"

[[key]]
path = "calendar.first_weekday"
default = "monday"
label = "First day of the week"
help = "Which day starts each week."
section = "Calendar"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["monday", "sunday"]

[key.page]
kind = "notifications"

[[key]]
path = "calendar.week_numbers"
default = "hide"
label = "Week numbers"
help = "Shows week numbers beside the month."
section = "Calendar"
exposure = "advanced"

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["hide", "show"]

[key.page]
kind = "notifications"

[[key]]
