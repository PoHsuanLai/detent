section = "Display & sleep"
exposure = "advanced"

[key.kind]
kind = "bounded"

[key.kind.v]
min = 0
max = 240
unit = "min"

[key.page]
kind = "power"

[[key]]
path = "idle.screen_off_battery_min"
default = 15
