[[key]]
path = "idle.lock"
default = "screen_off"
label = "Lock when the display turns off"
help = "Locks when idle turns the display off; sleep always locks."
section = "Display & sleep"
exposure = "advanced"
note = "Waking quickly can still skip the password (see Lock screen)."

[key.kind]
kind = "toggle"

[key.kind.v]
variants = ["screen_off", "never"]

[key.page]
kind = "power"

[[key]]
path = "keyboard.overrides"
default = []
label = "Per-app profiles"
help = "Gives an app its own keyboard profile, over the app's choice. Unknown names use the default."
section = "Apps"
exposure = "advanced"

[key.kind]
kind = "rows"

[[key.kind.v.columns]]
name = "app"
label = "App"

[key.kind.v.columns.kind]
kind = "text"

[key.kind.v.columns.kind.v]

[[key.kind.v.columns]]
name = "profile"
label = "Profile"

[key.kind.v.columns.kind]
kind = "text"

[key.kind.v.columns.kind.v]
pattern = "[a-z0-9_-]{1,64}"

[key.page]
