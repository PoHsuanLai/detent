[workspace]
resolver = "3"
members = [
  "crates/detent",
  "crates/detent-callers",
  "crates/detent-files",
  "crates/detent-intents",
  "crates/detent-model",
  "crates/detent-testkit",
  "crates/detent-ui",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
# What quire's ds-blitz needs; the toolchain itself is pinned in rust-toolchain.toml.
rust-version = "1.92"
repository = "https://github.com/PoHsuanLai/detent"
publish = false

[workspace.dependencies]
detent-callers = { path = "crates/detent-callers" }
detent-files   = { path = "crates/detent-files" }
detent-intents = { path = "crates/detent-intents" }
detent-model   = { path = "crates/detent-model" }
detent-testkit = { path = "crates/detent-testkit" }
detent-ui      = { path = "crates/detent-ui" }
# Sibling repos, checked out next to this one (the worktree holds symlinks to their masters).
ds          = { path = "../quire/crates/ds" }
ds-blitz    = { path = "../quire/crates/ds-blitz" }
ds-harness  = { path = "../quire/crates/ds-harness" }
# The distro family and the release (`os-release`), for the install line of a missing program; the PackageKit backend is not wanted.
ds-helpers  = { path = "../quire/crates/ds-helpers", default-features = false }
ds-lint     = { path = "../quire/crates/ds-lint" }
# A deadline for every call to another process (`Deadline`, `within`).
ds-peer     = { path = "../quire/crates/ds-peer" }
ds-settings = { path = "../quire/crates/ds-settings" }  # detent-ui adds the `dioxus` feature for `use_environment`
# The typed desktop client for wlroots-style compositors (own repo, a sibling checkout): the Displays page
# reads the output heads and applies a change through it, as sill's desktop arm does.
desktop-client = { path = "../casement-protocols/desktop-client", features = ["client"] }
# docket (private repo, by path like quire): the app side of the intents wire. `docket-client`'s `dbus`
# feature serves `org.quire.IntentProvider1`; `prov` and `porter-core` are the label and name types
# its signatures use, taken from the same porter checkout docket takes.
docket-client = { path = "../docket/crates/docket-client", features = ["dbus"] }
docket-core   = { path = "../docket/crates/docket-core" }
docket-dbus   = { path = "../docket/crates/docket-dbus" }
# The assistant's places (where it may run) and the Space-removal choice, typed by their owners.
docket-settings = { path = "../docket/crates/docket-settings" }
# Where the outside agents docket may start are installed and what each last offered (the type in `read_agents`' signature).
docket-agents = { path = "../docket/crates/docket-agents" }
almanac-core  = { path = "../almanac/crates/almanac-core" }
porter-core   = { path = "../porter/crates/porter-core" }
prov          = { path = "../porter/crates/prov" }

# porter: the model picker's vocabulary (tiers, the Why and Declined facts) and inferd's bus names.
porter-dbus  = { path = "../porter/crates/porter-dbus" }
# The engines Settings can download (llama.cpp, vLLM, Strata): the pinned manifest and the installs.
porter-engines = { path = "../porter/crates/porter-engines" }
porter-engines-install = { path = "../porter/crates/porter-engines-install" }
porter-daemon = { path = "../porter/crates/porter-daemon", default-features = false }
# Settings' own "Add Account…" goes through the app-facing client (the Settings role may call AddAccount).
porter-client = { path = "../porter/crates/porter-client", default-features = false, features = ["dbus"] }
# The provider files porter ships, for the marks (`mark_face`) of the providers Settings shows.
porter-provider = { path = "../porter/crates/porter-provider" }
porter-infer = { path = "../porter/crates/porter-infer" }

# A rows column's pattern: the whole cell must match it.
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }

# The portable keymap core (own repo, public): the Shortcuts list reads and edits the person's keymap
# with it. The same line as quire's pinned block, so the lock holds one copy.
chordkit = { git = "https://github.com/PoHsuanLai/chordkit.git", rev = "eb0deff12add543565ec41eecffda646ede43cf0" }

# The desktop's keymap (chordkit's layers) and keycap's program end, `KeycapSource`: the same line as casement's.
keycap-client = { git = "https://github.com/PoHsuanLai/keycap", rev = "ffcc2dbb0c9b6fffd123f94777352cb59250282d" }

# Which program is on the other end of a bus name (own repo, public): pinned process, unit and the
# desktop's caller table. v0.1.3 read another user's closed root as no sandbox; v0.1.4 added developer rows. quire's ds-blitz pins its own tag, so the lock holds a second copy until quire moves. zbus runs on
# tokio here, so `tokio` is on and the default executor is off; `desktop` is the role names. `dev-rows` (a
# person's own rows file, `Proof::Dev`) is only behind detent-callers' `dev-callers`, itself only behind the
# `detent` binary's `dev-callers` feature, so no shipped build has it.
# NetworkManager and BlueZ zbus proxies, shared with sill.
airwaves-nm = { git = "https://github.com/PoHsuanLai/airwaves", tag = "v0.1.0", default-features = false, features = ["tokio"] }
airwaves-bluez = { git = "https://github.com/PoHsuanLai/airwaves", tag = "v0.1.0", default-features = false, features = ["tokio"] }
peephole-bus = { git = "https://github.com/PoHsuanLai/peephole", tag = "v0.1.9", default-features = false, features = ["desktop", "tokio"] }

# The person's own user id, to tell their rows file from someone else's (only behind `dev-callers`).
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }

# Editing a settings file in place, keeping every key, comment and spacing the edit does not touch.
toml_edit = "0.25"

# ---- BEGIN PINNED BLOCK (source of truth: quire/docs/workspace-deps.toml) ----
# Copied verbatim into [workspace.dependencies] of quire, shell-host and sill. Bumped only by a
# dedicated "toolchain bump" wave that runs every repo's gates. Versions of the render stack
# (anyrender, vello, wgpu, parley) are the ones blitz's own Cargo.lock resolves at this rev;
# taffy (git) and stylo come through the blitz crates and are never named directly.

# The portable Blitz repairs (own repo, public). Local checkouts redirect it to a sibling path through
# each workspace root's [patch] (quire/CONSUMING.md section 1); git consumers get this rev.
blitz-kit = { git = "https://github.com/PoHsuanLai/blitz-kit", rev = "878dc7991ceb41059537e1defe38763fb83835f0" }

# Blitz: git main, pinned by rev (crates.io dioxus-native 0.8 alpha does not build with
# blitz 0.3.0-beta.2). The in-tree dioxus-native-dom targets dioxus 0.7.x.
# Blitz comes from our fork (github.com/PoHsuanLai/blitz, branch quire-pin): upstream e99fbdbd plus
# bf588142 (restyles elements whose animation was cancelled mid-way) and 1b23fbd9 (attributes carry no
# namespace, so `[data-x=y]` matches) (sill G295), 5fbd299d (SVG <image href> is data: only), 640dd2d9
# (a hoisted child's overflow counts in its stacking parent's hit bounds) and cf4cb398 (an inline svg
# rebuilds when its computed colour changes). Move back
# to DioxusLabs/blitz when a toolchain-bump wave finds the fix (or its equivalent) upstream.
blitz-dom = { git = "https://github.com/PoHsuanLai/blitz", rev = "851fa7dda55f4086f49ec221a7ac5fcfb1493856", default-features = false, features = ["svg", "system-fonts", "custom-widget", "accessibility"] }
blitz-paint = { git = "https://github.com/PoHsuanLai/blitz", rev = "851fa7dda55f4086f49ec221a7ac5fcfb1493856", features = ["custom-widget"] }
blitz-traits = { git = "https://github.com/PoHsuanLai/blitz", rev = "851fa7dda55f4086f49ec221a7ac5fcfb1493856" }
# The HTML parser (html5ever 0.39): an `<iframe srcdoc>` builds a real sub-document. ds-blitz
# installs it in headless documents; the window gets it through dioxus-native's `html` feature.
blitz-html = { git = "https://github.com/PoHsuanLai/blitz", rev = "851fa7dda55f4086f49ec221a7ac5fcfb1493856" }
dioxus-native-dom = { git = "https://github.com/PoHsuanLai/blitz", rev = "851fa7dda55f4086f49ec221a7ac5fcfb1493856", default-features = false, features = ["svg", "system-fonts", "accessibility"] }
# The portable window path for apps (winit); the shell uses shell-host instead.
dioxus-native = { git = "https://github.com/PoHsuanLai/blitz", rev = "851fa7dda55f4086f49ec221a7ac5fcfb1493856", default-features = false, features = ["vello-hybrid", "svg", "system-fonts", "accessibility"] }
# The window shell under dioxus-native, named for `ds_blitz::open_window`: its proxy and window
# config types build a second DioxusNativeApplication on the same event loop. dioxus-native's
# own `dioxus:` asset resolver and link opener come with it (both already in the tree through
# dioxus-native, same versions), since ds-blitz now builds the window's document itself.
blitz-shell = { git = "https://github.com/PoHsuanLai/blitz", rev = "851fa7dda55f4086f49ec221a7ac5fcfb1493856", default-features = false }
dioxus-asset-resolver = { version = "0.7", features = ["native"] }
webbrowser = "1.0"
# The system clipboard's text/html, for an edit surface's paste (ds-blitz): blitz-shell's own
# arboard (its `clipboard` feature, same features), read directly since ShellProvider has text only.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }

# Dioxus 0.7.x (renderer-free core; mailo is on 0.7.10).
dioxus = { version = "0.7", default-features = false, features = ["macro", "html", "hooks", "signals"] }
dioxus-document = "0.7"

# Render stack, matched to blitz's lockfile at the rev above.
anyrender = "0.13"
anyrender_vello_hybrid = "0.10"
anyrender_vello_cpu = { version = "0.17", features = ["multithreading", "filters"] }
vello_hybrid = "0.1"
wgpu = "29"
wgpu_context = "0.9"
# Per-device image cache for the shared hybrid renderer (SPIKE.md S1 finding 5).
rustc-hash = "2"
vello_common = "0.1"
parley = { version = "0.11.1", default-features = false, features = ["std"] }
image = { version = "0.25.6", default-features = false, features = ["png", "jpeg"] }

# Wayland client (shell-host and sill share one sctk major).
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
wayland-server = "0.31"
calloop = "0.14"
calloop-wayland-source = "0.4"
xkbcommon = "0.8"
raw-window-handle = "0.6"
keyboard-types = "0.7"
cursor-icon = "1"

# Common.
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-timer = "3"
cssparser = "0.37"
notify = "8.2"
# zbus with its default async-io backend: a library must not pick the executor for its
# consumers (mailo's blocking keyring calls under a tokio runtime panicked when ds-settings
# forced zbus/tokio through feature unification). Shells that run zbus under tokio enable
# `ds-settings/tokio` instead.
zbus = { version = "5.19" }
dirs = "6"
toml = "1"
# SSR renders for component goldens and markup lint (dev-dependency in consumers).
dioxus-ssr = "0.7"
# Named directly for image paints in custom widgets (blitz re-exports nothing).
peniko = "0.6"
# PDF output (ds-blitz `pdf`): pdfrum, the user's own pure-Rust PDF library
# (github.com/PoHsuanLai/pdfrum, MIT OR Apache-2.0). `pdfrum-anyrender` is the anyrender painter
# (scenes as vector PDF pages); it writes through pdfrum-edit (glyph-run fonts subset and
# instanced, gradients, JPEG and PNG passthrough; `variable-fonts` lets the subsetter instance
# variable and CFF2 faces). Every pdfrum crate comes from crates.io at one minor (0.5), so the tree holds
# one copy of each.
pdfrum-anyrender = "0.5"
pdfrum-edit = { version = "0.5", features = ["variable-fonts"] }
pdfrum-object = "0.5"
pdfrum-common = "0.5"
# Font tables read directly by ds-blitz's tests (cmap): the version parley already resolves at
# the blitz rev. pdfrum pins its own skrifa for its painter; the two do not meet in a signature.
skrifa = "0.44"
# Reading PDFs back in tests (text, fonts, images, a rasterised page): dev-dependency only.
pdfrum = { version = "0.5", default-features = false, features = ["vello-cpu"] }
# The print portal's fd, from a sealed anonymous file (ds-blitz's `print` feature, Linux only).
memfd = "0.6"
# Spellchecking (ds-blitz's `spell` feature): a pure-Rust Hunspell-compatible checker,
# MPL-2.0 (file-level copyleft, allowed by deny.toml), used unmodified. Dictionaries are the
# system's (/usr/share/hunspell); none is bundled.
spellbook = "0.4"
# Proc-macro crates for ds-settings-derive.
syn = { version = "2", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
proc-macro-crate = "3"

# Shell-only.
upower_dbus = { git = "https://github.com/pop-os/dbus-settings-bindings", rev = "eed01dd3609e90e3c8cd043656734c500956c793" }
logind-zbus = "5"
libpulse-binding = "2.30"
system-tray = "0.8.9"
freedesktop-icons = "0.4"
nucleo-matcher = "0.3.1"
fend-core = "1.5.8"
clap = { version = "4", features = ["derive"] }
# ---- END PINNED BLOCK ----

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

# vello and anyrender come from our forks, as in quire's root manifest (a patch applies only at
# the workspace root, so a consumer that builds the renderer copies the block verbatim).
[patch.crates-io]
vello_common = { git = "https://github.com/PoHsuanLai/vello", rev = "84b2c9f7debed7d15f48d0ec9ea8575c16a56938" }
vello_cpu = { git = "https://github.com/PoHsuanLai/vello", rev = "84b2c9f7debed7d15f48d0ec9ea8575c16a56938" }
vello_hybrid = { git = "https://github.com/PoHsuanLai/vello", rev = "84b2c9f7debed7d15f48d0ec9ea8575c16a56938" }
vello_sparse_shaders = { git = "https://github.com/PoHsuanLai/vello", rev = "84b2c9f7debed7d15f48d0ec9ea8575c16a56938" }
glifo = { git = "https://github.com/PoHsuanLai/vello", rev = "84b2c9f7debed7d15f48d0ec9ea8575c16a56938" }
anyrender = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
anyrender_vello_cpu = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
anyrender_vello_hybrid = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
wgpu_context = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
pixels_window_renderer = { git = "https://github.com/PoHsuanLai/anyrender", rev = "d4ae3885f89a58351ff7e99cd75d9b7de5865337" }
# dioxus-core 0.7.10 can spin forever in VirtualDom::wait_for_work: a task woken and then cancelled
# before it is polled (a use_resource restart) leaves an empty entry in the dirty-task queue that
# pop_task never removes. Fixed upstream in DioxusLabs/dioxus#5554 (0.8-alpha only); this fork
# (github.com/PoHsuanLai/dioxus, branch quire-0.7) backports it onto 0.7.10. Remove when quire
# moves to dioxus 0.8.
dioxus-core = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
dioxus-core-types = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
generational-box = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
subsecond = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }
subsecond-types = { git = "https://github.com/PoHsuanLai/dioxus", rev = "a615fd9f09e272c688a45e366161c576cecf0439" }

# porter takes stoker by git rev (porter ARCHITECTURE section 1); the sibling checkout is the one copy of cua-action.
[patch."https://github.com/PoHsuanLai/stoker"]
cua-action = { path = "../stoker/crates/cua-action" }
genai-names = { path = "../stoker/crates/genai-names" }
model-provider = { path = "../stoker/crates/model-provider" }
vision-prep = { path = "../stoker/crates/vision-prep" }

# the git copies of porter and almanac (taken by git inside those repos) are the sibling checkouts here: one copy.
[patch."https://github.com/PoHsuanLai/almanac"]
almanac-core = { path = "../almanac/crates/almanac-core" }

[patch."https://github.com/PoHsuanLai/porter"]
porter-client = { path = "../porter/crates/porter-client" }
porter-core = { path = "../porter/crates/porter-core" }
porter-dbus = { path = "../porter/crates/porter-dbus" }
porter-provider = { path = "../porter/crates/porter-provider" }
porter-infer = { path = "../porter/crates/porter-infer" }
prov = { path = "../porter/crates/prov" }

# quire's ds-blitz takes blitz-kit by git rev; the sibling checkout is the one copy.
[patch."https://github.com/PoHsuanLai/blitz-kit"]
blitz-kit = { path = "../blitz-kit/crates/blitz-kit" }
