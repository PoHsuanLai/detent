[package]
name = "detent-client"
description = "The one door the Settings window uses: a live value per pane, and the commands the person gives it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
detent-files = { workspace = true }
detent-model = { workspace = true }
detent-system = { workspace = true }
ds-settings = { workspace = true, features = ["live", "tokio"] }
porter-infer = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
zbus = { workspace = true, features = ["tokio"] }

[dev-dependencies]
almanac-core = { workspace = true }
# The tests of the panes run over the in-memory links.
detent-system = { workspace = true, features = ["testing"] }
ds-settings = { workspace = true, features = ["testing"] }

[lints]
workspace = true
