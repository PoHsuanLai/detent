[package]
name = "detent-ui"
description = "The Settings window: sidebar, pages and controls, drawn only with quire's components."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
# The compiler is the fence: the window names only the client (its one door to the computer), the
# model (its facts, and the other crates' types they are made of) and quire. Never detent-files,
# detent-system, porter-*, almanac-*, docket-* or zbus.
detent-client = { workspace = true }
detent-model = { workspace = true }
dioxus = { workspace = true }
ds = { workspace = true }
ds-blitz = { workspace = true }
ds-helpers = { workspace = true }
ds-lint = { workspace = true }
ds-settings = { workspace = true, features = ["dioxus", "live", "tokio"] }
tokio = { workspace = true }

[dev-dependencies]
# Fixtures: the in-memory links and the test kit, and quire's harness. The tests that still stand a
# service up on a private bus, because the pane follows a daemon's live settings module (Accounts,
# Intelligence, Privacy, the model picker) and no client fake stands in for one, need the
# commented ones below.
detent-system = { workspace = true, features = ["testing"] }
detent-testkit = { workspace = true }
ds-settings = { workspace = true, features = ["testing"] }
dioxus-ssr = { workspace = true }
ds-harness = { workspace = true }
image = { workspace = true }
toml = { workspace = true }
# A stand-in service on a private bus is vouched for by `AnyOwner`, or by the role check over peers
# a test introduces owners to (the squatter test).
detent-callers = { workspace = true, features = ["testing"] }
# Reads and writes the settings files and desktop entries the tests seed and check.
detent-files = { workspace = true }
# The stand-in daemons' wire: bus names, paths and the zbus interfaces they serve.
porter-dbus = { workspace = true }
zbus = { workspace = true, features = ["tokio"] }
# The Intelligence test's stand-in inferd answers with porter's kinds and inference types.
porter-core = { workspace = true }
porter-infer = { workspace = true }
# The Assistants test reads docket's places file.
docket-settings = { workspace = true }
# The lending test's service manager implements porter's `UnitManager`.
porter-client = { workspace = true, features = ["infer", "lending"] }
# The Keyboard test names chords.
chordkit = { workspace = true }

[lints]
workspace = true
